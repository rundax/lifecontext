; CouchDB settings for Self-hosted LiveSync. compose.yaml mounts this file read-only
; as /opt/couchdb/etc/local.d/livesync.ini. It holds no secrets.

[couchdb]
; One node: CouchDB creates its system databases itself and needs no cluster setup.
single_node = true
; Largest document (50 MB), enough for attachments and large notes.
max_document_size = 50000000

[chttpd]
; Inside the container; compose publishes the port on 127.0.0.1 of the host only.
bind_address = 0.0.0.0
port = 5984
; Largest request (4 GB): the first upload of a big vault.
max_http_request_size = 4294967296
; Every request needs a CouchDB account.
require_valid_user = true

[chttpd_auth]
require_valid_user = true
authentication_redirect = /_utils/session.html

[httpd]
WWW-Authenticate = Basic realm="couchdb"
enable_cors = true

[cors]
; The origins Obsidian uses on desktop (app://obsidian.md) and mobile (capacitor://localhost, http://localhost).
credentials = true
origins = app://obsidian.md,capacitor://localhost,http://localhost
headers = accept, authorization, content-type, origin, referer
methods = GET, PUT, POST, HEAD, DELETE
max_age = 3600

[log]
level = warning
