name: Feature request
description: Suggest a change or a new capability.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
      description: How it could work from the user's or agent's side (command, output, file in the vault).
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: dropdown
    id: contribute
    attributes:
      label: Would you like to implement it?
      description: Contributions need a signed CLA (see CONTRIBUTING.md).
      options:
        - "No"
        - "Yes, after we agree on the approach"
